services:
  # ============================================================
  # Infrastructure: Milvus Vector Store
  # ============================================================
  etcd:
    image: quay.io/coreos/etcd:v3.5.5
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    volumes:
      - etcd_data:/etcd
    command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    volumes:
      - minio_data:/minio_data
    command: minio server /minio_data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  milvus:
    image: milvusdb/milvus:v2.3.4
    container_name: milvus
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    volumes:
      - milvus_data:/var/lib/milvus
    ports:
      - "19530:19530"
      - "9091:9091"
    depends_on:
      etcd:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 15s
      timeout: 10s
      retries: 10

  # ============================================================
  # Infrastructure: Redis (Cache + Celery Broker)
  # ============================================================
  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ============================================================
  # Infrastructure: PostgreSQL (Metadata Database)
  # ============================================================
  postgres:
    image: postgres:15-alpine
    container_name: postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-evrag}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-evrag_password}
      POSTGRES_DB: ${POSTGRES_DB:-evragdb}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init_data/postgres:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-evrag} -d ${POSTGRES_DB:-evragdb}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================================
  # EV RAG API (FastAPI backend)
  # ============================================================
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ev-rag-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      MILVUS_HOST: milvus
      REDIS_HOST: redis
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      POSTGRES_HOST: postgres
      DATA_DIR: /app/data
    volumes:
      - ./data:/app/data
    depends_on:
      milvus:
        condition: service_healthy
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 5

  # ============================================================
  # Celery Worker — Ingestion Queue
  # ============================================================
  worker-ingestion:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ev-rag-worker-ingestion
    env_file:
      - .env
    environment:
      MILVUS_HOST: milvus
      REDIS_HOST: redis
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      POSTGRES_HOST: postgres
      DATA_DIR: /app/data
    volumes:
      - ./data:/app/data
    depends_on:
      redis:
        condition: service_healthy
      milvus:
        condition: service_healthy
    command: >
      celery -A app.workers.celery_app worker
      --loglevel=INFO
      --queues=ingestion
      --concurrency=2
      --max-tasks-per-child=100
      --hostname=ingestion@%h

  # ============================================================
  # Celery Worker — Embedding Queue
  # ============================================================
  worker-embedding:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ev-rag-worker-embedding
    env_file:
      - .env
    environment:
      MILVUS_HOST: milvus
      REDIS_HOST: redis
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      POSTGRES_HOST: postgres
      DATA_DIR: /app/data
    volumes:
      - ./data:/app/data
    depends_on:
      redis:
        condition: service_healthy
      milvus:
        condition: service_healthy
    command: >
      celery -A app.workers.celery_app worker
      --loglevel=INFO
      --queues=embedding
      --concurrency=1
      --max-tasks-per-child=50
      --hostname=embedding@%h

  # ============================================================
  # Nginx API Gateway
  # ============================================================
  gateway:
    image: nginx:alpine
    container_name: ev-rag-gateway
    ports:
      - "8080:80"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
      - streamlit
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:80/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ============================================================
  # Streamlit Chat UI
  # ============================================================
  streamlit:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ev-rag-streamlit
    ports:
      - "8501:8501"
    env_file:
      - .env
    environment:
      STREAMLIT_API_URL: http://api:8000
    depends_on:
      - api
    command: streamlit run streamlit_app/app.py --server.port=8501 --server.address=0.0.0.0

volumes:
  etcd_data:
  minio_data:
  milvus_data:
  redis_data:
  postgres_data:

networks:
  default:
    name: ev-rag-network
