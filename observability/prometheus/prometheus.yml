global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: ev-rag-platform
    environment: production

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: ev_rag_backend
    metrics_path: /metrics
    static_configs:
      - targets:
          - api:8000
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        regex: (.*):.*
        replacement: $1

  - job_name: ev_rag_worker
    metrics_path: /metrics
    static_configs:
      - targets:
          - worker:9100

  - job_name: redis
    static_configs:
      - targets:
          - redis:6379

  - job_name: milvus
    static_configs:
      - targets:
          - milvus:9091
    metrics_path: /metrics

  - job_name: postgres
    static_configs:
      - targets:
          - postgres:9187
