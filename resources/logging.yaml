# ========================================================
# EV RAG Platform — Structured Logging Configuration
# Uses structlog for JSON-structured logging
# ========================================================

version: 1
disable_existing_loggers: false

formatters:
  json:
    format: "%(message)s"
    class: pythonjsonlogger.jsonlogger.JsonFormatter
    datefmt: "%Y-%m-%dT%H:%M:%S"

  console:
    format: "%(asctime)s [%(levelname)s] %(name)s - %(message)s"
    datefmt: "%Y-%m-%dT%H:%M:%S"

handlers:
  console:
    class: logging.StreamHandler
    level: INFO
    formatter: console
    stream: ext://sys.stdout

  json_file:
    class: logging.handlers.RotatingFileHandler
    level: DEBUG
    formatter: json
    filename: /var/log/ev-rag/app.log
    maxBytes: 10485760  # 10MB
    backupCount: 5

loggers:
  app:
    level: INFO
    handlers: [console]
    propagate: false

  app.retrieval:
    level: INFO
    handlers: [console]

  app.ingestion:
    level: INFO
    handlers: [console]

  app.workers:
    level: INFO
    handlers: [console]

root:
  level: WARNING
  handlers: [console]
