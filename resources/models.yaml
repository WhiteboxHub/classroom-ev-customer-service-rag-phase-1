# ========================================================
# EV RAG Platform — Model Registry
# Centralized model configuration for all ML components
# ========================================================

embedding_models:
  default:
    name: sentence-transformers/all-MiniLM-L6-v2
    dimension: 384
    max_seq_length: 256
    normalize_embeddings: true
    description: Fast, efficient embedding for EV troubleshooting retrieval

  high_accuracy:
    name: sentence-transformers/all-mpnet-base-v2
    dimension: 768
    max_seq_length: 384
    normalize_embeddings: true
    description: Higher accuracy embedding for complex technical docs

  multilingual:
    name: sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2
    dimension: 384
    max_seq_length: 128
    description: For international EV markets with non-English documentation

reranker_models:
  default:
    name: cross-encoder/ms-marco-MiniLM-L-6-v2
    description: Fast cross-encoder for EV retrieval reranking

  high_accuracy:
    name: cross-encoder/ms-marco-electra-base
    description: Higher accuracy cross-encoder for critical EV diagnostics

llm_models:
  default:
    provider: openai
    model: gpt-4o-mini
    temperature: 0.1
    max_tokens: 1024
    description: Default LLM for EV troubleshooting grounded generation

  advanced:
    provider: openai
    model: gpt-4o
    temperature: 0.0
    max_tokens: 2048
    description: Advanced LLM for complex multi-step EV diagnostics
