version: '3.8'

# ============================================================
# EV RAG Platform — Operations Stack
# Run: docker compose -f docker-compose.yml -f docker-compose.ops.yml up -d
# ============================================================

services:
  # ============================================================
  # Prometheus — Metrics Collection
  # ============================================================
  prometheus:
    image: prom/prometheus:latest
    container_name: ev-rag-prometheus
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'
      - '--web.enable-admin-api'
    networks:
      - default

  # ============================================================
  # Grafana — Dashboards
  # ============================================================
  grafana:
    image: grafana/grafana:latest
    container_name: ev-rag-grafana
    ports:
      - "3001:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ev_rag_admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_INSTALL_PLUGINS: grafana-clock-panel,grafana-simple-json-datasource
    networks:
      - default

  # ============================================================
  # OpenTelemetry Collector — Distributed Tracing
  # ============================================================
  otel-collector:
    image: otel/opentelemetry-collector:latest
    container_name: ev-rag-otel-collector
    volumes:
      - ./observability/otel/otel-collector-config.yaml:/etc/otel/config.yaml:ro
    command: ["--config=/etc/otel/config.yaml"]
    ports:
      - "4317:4317"    # OTLP gRPC
      - "4318:4318"    # OTLP HTTP
      - "8889:8889"    # Prometheus metrics export
      - "13133:13133"  # Health check
    networks:
      - default

  # ============================================================
  # Jaeger — Trace Visualization
  # ============================================================
  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: ev-rag-jaeger
    ports:
      - "16686:16686"  # Jaeger UI
      - "14250:14250"  # Collector gRPC
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    networks:
      - default

  # ============================================================
  # Celery Flower — Worker Monitoring UI
  # ============================================================
  flower:
    image: mher/flower:latest
    container_name: ev-rag-flower
    ports:
      - "5555:5555"
    environment:
      CELERY_BROKER_URL: redis://redis:6379/1
      FLOWER_BASIC_AUTH: admin:ev_rag_flower
    depends_on:
      - redis
    networks:
      - default

volumes:
  prometheus_data:
  grafana_data:

networks:
  default:
    external: true
    name: ev-rag-network
