# ==============================================================
# EV RAG Platform — Nginx API Gateway Configuration
# Routes: /api/v1 → FastAPI backend | / → Streamlit UI
# ==============================================================

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time uct=$upstream_connect_time '
                    'uht=$upstream_header_time urt=$upstream_response_time';

    access_log /var/log/nginx/access.log main;

    # Performance
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    gzip on;
    gzip_types text/plain application/json application/javascript text/css;

    # Rate limiting
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=60r/m;
    limit_req_zone $binary_remote_addr zone=ingest_limit:10m rate=10r/m;

    upstream ev_rag_api {
        server api:8000;
        keepalive 32;
    }

    upstream ev_rag_ui {
        server streamlit:8501;
    }

    server {
        listen 80;
        server_name _;

        client_max_body_size 100M;  # For large PDF uploads

        # Health check (no rate limit)
        location /health {
            proxy_pass http://ev_rag_api/api/v1/health;
            proxy_set_header Host $host;
            access_log off;
        }

        # Prometheus metrics endpoint
        location /metrics {
            proxy_pass http://ev_rag_api/metrics;
            proxy_set_header Host $host;
            access_log off;
        }

        # API routes — rate limited
        location /api/v1/ingest {
            limit_req zone=ingest_limit burst=5 nodelay;
            proxy_pass http://ev_rag_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 120s;
        }

        location /api/ {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://ev_rag_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 60s;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        # API docs
        location /docs {
            proxy_pass http://ev_rag_api;
            proxy_set_header Host $host;
        }

        # Streamlit UI (root)
        location / {
            proxy_pass http://ev_rag_ui;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 300s;
        }
    }
}
